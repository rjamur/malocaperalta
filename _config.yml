title: "Maloca Peralta"
description: "Verdades ditas brincando — fábulas, crônicas e o Livro XP."
url: "https://malocaperalta.com.br"
baseurl: ""
lang: pt-BR
timezone: America/Sao_Paulo

markdown: kramdown

collections:
  historias:
    output: true
    permalink: /historias/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-maloca.jpg
  - scope:
      path: ""
      type: "historias"
    values:
      layout: "historia"

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
